plugins {
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'jacoco'
}

group = 'de.hhu.propra'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

    implementation 'com.github.slugify:slugify:3.0.7'

    // Bootstrap is served from a managed WebJar (no vendored node_modules).
    // webjars-locator-lite enables version-agnostic /webjars/** URLs.
    implementation 'org.webjars:bootstrap:5.3.3'
    implementation 'org.webjars:webjars-locator-lite'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// Exclude the Spring Boot bootstrap class (just main()) from coverage accounting.
def coverageExclusions = ['de/hhu/propra/link/LinkApplication.class']
def withoutExcluded = { dirs -> dirs.collect { fileTree(dir: it, exclude: coverageExclusions) } }

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(withoutExcluded(classDirectories.files))
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(withoutExcluded(classDirectories.files))
    }
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.85
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.75
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
